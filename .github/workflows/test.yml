name: Test

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch: # Adds "Run workflow" button in GitHub UI

env:
  NEXT_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_URL }}
  MAINNET_RPC_URL_1: ${{ secrets.MAINNET_RPC_URL_1 }}
  POLYGON_RPC_URL_1: ${{ secrets.POLYGON_RPC_URL_1 }}
  POLYGON_RPC_URL_2: ${{ secrets.POLYGON_RPC_URL_2 }}

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Foundry RPC cache
        uses: actions/cache/restore@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: ~/.foundry/cache/rpc-vitest
          key: foundry-rpc-vitest-${{ github.ref_name }}-v1-${{ github.run_id }}
          restore-keys: |
            foundry-rpc-vitest-${{ github.ref_name }}-v1-
            foundry-rpc-vitest--v1-

      - uses: foundry-rs/foundry-toolchain@8789b3e21e6c11b2697f5eb56eddae542f746c10 # v1
        with:
          version: v1.5.1
          cache: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm codegen

      - run: pnpm test run

      - name: Save Foundry RPC cache
        if: always()
        uses: actions/cache/save@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: ~/.foundry/cache/rpc-vitest
          key: foundry-rpc-vitest-${{ github.ref_name }}-v1-${{ github.run_id }}
